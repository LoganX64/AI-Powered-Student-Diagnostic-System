# Phase 3 scale-mode supporting services (Windows + Docker).
# Brings up Redis (job queue / rate-limit / autosave buffer) and an optional
# PgBouncer connection pooler in front of your Postgres. The API itself is run
# separately (go run ./cmd/api or your binary) and pointed at these via REDIS_URL.
#
#   docker compose up -d redis pgbouncer
#
# Note: PgBouncer is only needed at Band C surge. For local dev you can run just
# `docker compose up -d redis`. Point DB_URL at pgbouncer (port 6432) when using it.

services:
  redis:
    image: redis:7
    container_name: diag-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: diag-pgbouncer
    environment:
      DATABASE_URL: postgres://user:password@host.docker.internal:5432/student_diagnostic
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "6432:6432"
    depends_on:
      - redis

volumes:
  redis-data:
