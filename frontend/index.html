<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Multi-dimensional student diagnostics for coaching institutes: SQI scoring, live proctoring, exam autosave, and topic-level learning gap analysis."
    />

    <!-- Open Graph. og:image must be an absolute URL for crawlers that do not
         execute JS (Twitter/X, Slack, WhatsApp). TODO: replace the placeholder
         domain with the real production domain before deploying. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Student Diagnostic System" />
    <meta property="og:title" content="Student Diagnostic System" />
    <meta
      property="og:description"
      content="Multi-dimensional student diagnostics for coaching institutes: SQI scoring, live proctoring, exam autosave, and topic-level learning gap analysis."
    />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:image" content="https://yourdomain.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Student Diagnostic System" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Student Diagnostic System" />
    <meta
      name="twitter:description"
      content="Multi-dimensional student diagnostics for coaching institutes: SQI scoring, live proctoring, exam autosave, and topic-level learning gap analysis."
    />
    <meta name="twitter:image" content="https://yourdomain.com/og-image.png" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:8080 https: ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    />
    <title>Student Diagnostic System</title>
  </head>
  <body>
    <div id="root">
      <div id="splash-loader" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;font-family:system-ui,-apple-system,sans-serif;">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="20" stroke="#e5e7eb" stroke-width="4"/>
          <path d="M24 4a20 20 0 0 1 20 20" stroke="#6366f1" stroke-width="4" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24" dur="1s" repeatCount="indefinite"/>
          </path>
        </svg>
        <p style="margin:0;color:#6b7280;font-size:14px;">Loading...</p>
      </div>
    </div>
    <style>
      @keyframes splash-fade-out {
        from { opacity: 1; }
        to { opacity: 0; visibility: hidden; }
      }
      #splash-loader.hidden {
        animation: splash-fade-out 0.4s ease-out forwards;
        pointer-events: none;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
